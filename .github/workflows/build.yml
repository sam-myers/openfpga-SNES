################################################################################
# How to create a tag to launch the workflow
# git tag -a "0.1.0" -m "Release v0.1.0"
# git push origin --tags
################################################################################
# WARNING: Make sure to set action permissions to max ("Read and write permissions")
name: Build/Release
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - savestates
  pull_request:

permissions:
  contents: write

jobs:
  synthesis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # core: ["main", "pal", "spc", "sa1gsu", "pal_sa1gsu"]
        # TODO: Add SA1/GSU cores
        core: ["main", "pal", "spc", "sa1", "cx4"]
      fail-fast: false

    steps:
      - name: "🧰 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🧰 Checkout Packybara"
        uses: actions/checkout@v4
        with:
          repository: "agg23/pocketpublish"
          path: ".github/publish"

      - name: "🧰 Build bass assembler"
        shell: bash
        run: |
          git clone https://github.com/ARM9/bass.git "$RUNNER_TEMP/bass"
          git -C "$RUNNER_TEMP/bass" checkout c3962ec01f4768be1667db0d09c12141c28241f3
          # nall predates GCC 13's header cleanup
          BASS_CXX="g++ -include stdexcept -include limits -include cstdint"
          mkdir -p "$HOME/.local/bin"
          make -C "$RUNNER_TEMP/bass/bass" -j"$(nproc)" compiler="$BASS_CXX"
          make -C "$RUNNER_TEMP/bass/bass" install compiler="$BASS_CXX" prefix="$HOME/.local"

      - name: "🧩 Assemble savestate routine"
        shell: bash
        run: |
          cd support/savestates
          "$HOME/.local/bin/bass" savestates.asm
          ls -l savestates.bin
          python3 ../gen_ss_rom.py savestates.bin ../../rtl/mister_top/ss_rom.sv

      - name: "🏗️ Compile design"
        shell: bash
        run: |
          map_value() {
              case "$1" in
                  main)
                      echo "ntsc"
                      ;;
                  pal)
                      echo "pal"
                      ;;
                  spc)
                      echo "ntsc_spc"
                      ;;
                  sa1)
                      echo "ntsc_sa1"
                      ;;
                  cx4)
                      echo "ntsc_cx4"
                      ;;
                  sa1gsu)
                      echo "ntsc_sa1gsu"
                      ;;
                  pal_sa1gsu)
                      echo "pal_sa1gsu"
                      ;;
                  *)
                      echo "Unknown input"
                      ;;
              esac
          }

          build_type=$(map_value "${{ matrix.core }}")
          cmd="docker run --rm -v ${{ github.workspace }}:/build raetro/quartus:21.1 quartus_sh -t generate.tcl $build_type"
          echo "Running command: $cmd"
          eval $cmd

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports_${{ matrix.core }}
          path: |
            projects/output_files/*.summary
            projects/output_files/*.fit.rpt
            projects/output_files/*.sta.rpt
          if-no-files-found: ignore

      - name: Upload failure artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure_output_files_${{ matrix.core }}
          path: projects/output_files/

      - name: Reverse bitstream
        shell: bash
        run: |
          mkdir artifacts
          pip3 install -r .github/publish/requirements.txt
          python3 .github/publish/reverse.py projects/output_files/snes_pocket.rbf artifacts/snes_${{ matrix.core }}.rev

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snes_${{ matrix.core }}
          path: artifacts/snes_${{ matrix.core }}.rev

  packaging:
    runs-on: ubuntu-latest
    needs: synthesis
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "🧰 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🧰 Checkout Packybara"
        uses: actions/checkout@v4
        with:
          repository: "agg23/pocketpublish"
          path: ".github/publish"

      - name: "Create folders"
        run: |
          pip3 install -r .github/publish/requirements.txt
          python3 .github/publish/create_folders.py

      - name: "🧩 Assemble loader"
        shell: bash
        run: |
          # bass-chip32 specifies bass devel (v19), which loads architectures from beside its binary
          git clone https://github.com/ARM9/bass.git "$RUNNER_TEMP/bass"
          git -C "$RUNNER_TEMP/bass" checkout 828ad2c11bddac45c7daeba9293a5265f2994bd5
          make -C "$RUNNER_TEMP/bass/bass" -j"$(nproc)" compiler="g++ -include stdexcept -include limits -include cstdint"
          git clone https://github.com/open-fpga/bass-chip32.git "$RUNNER_TEMP/bass-chip32"
          git -C "$RUNNER_TEMP/bass-chip32" checkout 9e4a919d1ff39b217b75e090e996148654d3f9d7
          mkdir -p "$RUNNER_TEMP/bass/bass/out/architectures"
          cp -R "$RUNNER_TEMP/bass/bass/data/architectures/." "$RUNNER_TEMP/bass-chip32/architectures/." "$RUNNER_TEMP/bass/bass/out/architectures/"
          BASS="$RUNNER_TEMP/bass/bass/out/bass"

          # Sanity check the toolchain: upstream's loader.asm must reproduce upstream's loader.bin
          mkdir "$RUNNER_TEMP/upstream_loader"
          for f in loader.asm check_header.asm util.asm; do
            git show 1a08c84ddef760bedd30a376114fc2e97527df19:support/$f > "$RUNNER_TEMP/upstream_loader/$f"
          done
          (cd "$RUNNER_TEMP/upstream_loader" && "$BASS" loader.asm)
          git show 1a08c84ddef760bedd30a376114fc2e97527df19:pkg/pocket/Cores/agg23.SNES/loader.bin > "$RUNNER_TEMP/upstream_loader/expected.bin"
          cmp "$RUNNER_TEMP/upstream_loader/loader.bin" "$RUNNER_TEMP/upstream_loader/expected.bin"

          (cd support && "$BASS" loader.asm)
          cp support/loader.bin staging/Cores/agg23.SNES/loader.bin

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging/Cores/agg23.SNES/
          merge-multiple: true

      - name: "Release"
        run: |
          # Save state fork: never publish a GitHub release, the zip is uploaded as an Actions artifact below
          python3 .github/publish/release.py --norelease

      - name: "Upload Actions artifact"
        uses: actions/upload-artifact@v4
        with:
          # This must always be wrapped in an outer zip, so give it a name that makes sense
          name: "agg23.SNES"
          path: release/*.zip
